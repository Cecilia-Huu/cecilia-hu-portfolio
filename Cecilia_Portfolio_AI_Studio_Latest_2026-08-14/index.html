  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-5deg); }
    }
    .animate-float-1 { animation: floatSlow 6s ease-in-out infinite; }
    .animate-float-2 { animation: floatReverse 7s ease-in-out infinite 1s; }
    .animate-float-3 { animation: floatSlow 5.5s ease-in-out infinite 0.5s; }
  </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-teal-100 overflow-x-hidden min-h-screen flex flex-col justify-between">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('HOME');
      const [isModalOpen, setIsModalOpen] = useState(false);

      return (
        <div className="min-h-screen flex flex-col justify-between relative">
          
          {/* 1. 顶部悬浮胶囊导航 */}

              <div 
                className="font-bold text-xs tracking-wider uppercase text-slate-900 cursor-pointer flex items-center space-x-2"
                onClick={() => setActiveTab('HOME')}
              >
                <div className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-[10px]">胡</div>
                <span>胡敏雪 (CECILIA HU)</span>
              </div>

              <nav className="flex items-center space-x-1 sm:space-x-2 text-xs font-medium text-slate-600">

                  { id: 'HOME', label: 'Home' },

                  { id: 'EXPERIENCE', label: 'Experience' },

                    key={item.id}

              <ContactMenu />
            </div>
          </header>

          {/* 2. 主页面切换 */}
          <main className="pt-28 pb-16">
            {activeTab === 'HOME' && (
              <HomeLarryStyle 
                setActiveTab={setActiveTab} 
                onOpenMatcher={() => setIsModalOpen(true)} 
              />
            )}
            {activeTab === 'EDUCATION' && <EducationSection />}
            {activeTab === 'EXPERIENCE' && <ExperienceSection />}
            {activeTab === 'PROJECTS' && <ProjectsSection />}
            {activeTab === 'SKILLS' && <SkillsSection />}
          </main>

          {/* 3. 页脚 */}
          <footer className="py-6 border-t border-slate-100 text-center text-xs text-slate-400 font-mono">
            © 2026 CECILIA HU (胡敏雪) · Product Manager Portfolio
          </footer>

          {/* 4. AI 岗位匹配器 Modal 弹窗 */}
          {isModalOpen && <AIMatcherModal onClose={() => setIsModalOpen(false)} />}

        </div>
      );
    }

    function ContactMenu() {
      const email = 'hmxdxyx@163.com';
      const wechatId = 'cecilia1205hmx';
      const [isOpen, setIsOpen] = useState(false);
      const [copiedItem, setCopiedItem] = useState(null);
      const menuRef = useRef(null);
      const copyTimerRef = useRef(null);

      useEffect(() => {
        const handleOutsideClick = (event) => {
          if (menuRef.current && !menuRef.current.contains(event.target)) setIsOpen(false);
        };
        const handleEscape = (event) => {
          if (event.key === 'Escape') setIsOpen(false);
        };
        document.addEventListener('mousedown', handleOutsideClick);
        document.addEventListener('keydown', handleEscape);
        return () => {
          document.removeEventListener('mousedown', handleOutsideClick);
          document.removeEventListener('keydown', handleEscape);
          if (copyTimerRef.current) window.clearTimeout(copyTimerRef.current);
        };
      }, []);

      const copyContact = async (value, item) => {
        try {
          await navigator.clipboard.writeText(value);
        } catch (error) {
          const input = document.createElement('textarea');
          input.value = value;
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
        }
        setCopiedItem(item);
        if (copyTimerRef.current) window.clearTimeout(copyTimerRef.current);
        copyTimerRef.current = window.setTimeout(() => setCopiedItem(null), 1800);
      };

      return (
        <div ref={menuRef} className="relative">
          <button
            type="button"
            aria-expanded={isOpen}
            aria-controls="contact-popover"
            onClick={() => setIsOpen(!isOpen)}
            className="group flex items-center gap-1.5 rounded-full bg-[#FF5500] px-4 py-1.5 text-xs font-bold text-white shadow-[0_8px_20px_rgba(255,85,0,.22)] transition-all duration-200 hover:px-5 hover:bg-[#E94E00] hover:shadow-[0_10px_24px_rgba(255,85,0,.30)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-300 focus-visible:ring-offset-2"
          >
            Let’s Talk
            <span className="transition-transform duration-200 group-hover:-translate-y-0.5 group-hover:translate-x-0.5" aria-hidden="true">↗</span>
          </button>

          {isOpen && (
            <div id="contact-popover" role="dialog" aria-label="Contact Cecilia" className="absolute right-0 top-full z-50 mt-2.5 w-[300px] max-w-[calc(100vw-1.5rem)] rounded-3xl border border-slate-200/50 bg-white/[0.92] p-4 shadow-[0_20px_48px_rgba(15,23,42,.10)] backdrop-blur-md">
              <div className="absolute -top-1.5 right-7 h-3 w-3 rotate-45 border-l border-t border-slate-200/50 bg-white/[0.92]" />
              <div className="flex items-center justify-between">
                <div>
                  <p className="text-base font-extrabold text-slate-900">Say hi! <span aria-hidden="true">👋</span></p>
                  <p className="mt-0.5 text-[10px] text-slate-400">I’d love to hear from you.</p>
                </div>
                <button type="button" onClick={() => setIsOpen(false)} aria-label="关闭联系卡片" className="flex h-7 w-7 items-center justify-center rounded-full bg-slate-100 text-[10px] text-slate-500 transition-colors hover:bg-slate-200">✕</button>
              </div>

              <div className="mt-4 space-y-2">
                <div className="flex h-11 items-center gap-2.5 rounded-xl px-2.5 transition-colors duration-200 hover:bg-slate-50">
                  <span className="flex h-7 w-7 flex-none items-center justify-center rounded-lg border border-slate-200 text-[12px] text-slate-600" aria-hidden="true">✉</span>
                  <a href={'mailto:' + email} className="min-w-0 flex-1 truncate text-[11px] font-semibold text-slate-700 transition-colors hover:text-[#FF5500]">{email}</a>
                  <button type="button" aria-label="Copy email address" onClick={() => copyContact(email, 'email')} className="min-w-[66px] rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[9px] font-bold text-slate-600 transition-all hover:border-orange-200 hover:text-[#FF5500] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-300" aria-live="polite">
                    {copiedItem === 'email' ? 'Copied! ✓' : 'Copy'}
                  </button>
                </div>

                <a aria-label="Open Cecilia's LinkedIn" href="https://www.linkedin.com/in/minxue-hu-986b5a38b" target="_blank" rel="noopener noreferrer" className="flex h-11 items-center gap-2.5 rounded-xl px-2.5 text-[11px] font-semibold text-slate-700 transition-colors duration-200 hover:bg-slate-50 hover:text-[#0A66C2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-300">
                  <span className="flex h-7 w-7 flex-none items-center justify-center rounded-lg border border-slate-200 font-serif text-[10px] font-bold text-slate-600" aria-hidden="true">in</span>
                  <span className="flex-1">LinkedIn</span>
                  <span className="pr-2 text-slate-400" aria-hidden="true">↗</span>
                </a>

                <div className="flex h-11 items-center gap-2.5 rounded-xl px-2.5 transition-colors duration-200 hover:bg-white/55">
                  <img src="assets/wechat-contact-icon.png" alt="" aria-hidden="true" className="h-7 w-7 flex-none object-contain" />
                  <span className="min-w-0 flex-1 truncate text-[11px] font-semibold text-slate-700">{wechatId}</span>
                  <button type="button" aria-label="Copy WeChat ID" onClick={() => copyContact(wechatId, 'wechat')} className="min-w-[66px] rounded-full border border-slate-200 bg-white px-2.5 py-1 text-[9px] font-bold text-slate-600 transition-all hover:border-orange-200 hover:text-[#FF5500] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-orange-300" aria-live="polite">
                    {copiedItem === 'wechat' ? 'Copied! ✓' : 'Copy'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* =========================================================================

          </div>

          <div className="absolute top-[40%] left-[2%] sm:left-[6%] w-20 h-20 sm:w-32 sm:h-32 animate-float-2 pointer-events-none">

          </div>

          <div className="absolute top-4 right-[6%] w-20 h-20 sm:w-28 sm:h-28 animate-float-2 pointer-events-none">

          {/* HERO 主体 */}
          <div className="space-y-6 max-w-2xl relative z-20">
            
            {/* 标题：Hi I am 不加粗 */}
            <div className="space-y-1">

              <p className="text-base sm:text-xl font-medium text-slate-500 pt-1">
                Product Manager / 产品经理
              </p>
            </div>

            {/* 人物肖像卡片 */}
            <div className="relative inline-block my-2">
              <div className="relative w-64 h-72 sm:w-72 sm:h-80 rounded-[44px] bg-[#FFB36B] shadow-2xl shadow-orange-300/30 overflow-hidden">
                <img 
                  src="assets/cecilia-home-cutout.png" 
                  alt="Cecilia Hu holding a coffee and making a peace sign" 
                  className="absolute left-1/2 -bottom-5 w-[124%] max-w-none h-auto -translate-x-1/2 object-contain object-bottom" 
                />
              </div>

              {/* 标签：27届同济大学硕士研究生 */}
              <div className="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-md px-4 py-2 rounded-full border border-slate-200/80 shadow-md text-xs font-semibold text-slate-800 whitespace-nowrap">

              </div>

              <button

    /* =========================================================================
       02. EDUCATION SECTION (Tiny Planet + clean education list)
       ========================================================================= */
    function EducationSection() {
      const educationData = [
        { id: 'tongji', num: '01', accent: '#FF5A1F', shape: 'triangle', schoolZh: '同济大学', schoolEn: 'Tongji University', period: '2024–2027', degree: '国际关系硕士', highlights: ['GPA 4.81 / 5', '均分 90.93'] },
        { id: 'turin', num: '02', accent: '#7C3AED', shape: 'circle', schoolZh: '意大利都灵大学', schoolEn: 'University of Turin', period: '2025–2026', degree: '国际关系双学位', highlights: ['欧盟国际角色', '全球经济与跨国公司'] },
        { id: 'ucsb', num: '03', accent: '#2563EB', shape: 'square', schoolZh: '加州大学圣塔芭芭拉分校', schoolEn: 'University of California, Santa Barbara', period: '2021–2022', degree: 'Winter Visiting Student', highlights: ['全球经济与发展', '全球文化与道德'] },
        { id: 'hbu', num: '04', accent: '#0FAF8F', shape: 'diamond', schoolZh: '湖北大学', schoolEn: 'Hubei University', period: '2019–2023', degree: '国际关系本科', highlights: ['专业排名 2 / 68', '均分 92'] },
      ];

      const [planetRotation, setPlanetRotation] = useState(0);
      const planetDrag = useRef(null);

      useEffect(() => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let animationFrame;
        let lastTime = performance.now();

        const rotatePlanet = (time) => {
          const elapsed = Math.min(time - lastTime, 50);
          lastTime = time;

          if (!planetDrag.current && !reduceMotion.matches) {
            // One calm revolution every two minutes.
            setPlanetRotation((angle) => (angle + elapsed * 0.003) % 360);
          }

          animationFrame = requestAnimationFrame(rotatePlanet);
        };

        animationFrame = requestAnimationFrame(rotatePlanet);
        return () => cancelAnimationFrame(animationFrame);
      }, []);

      const startPlanetDrag = (event) => {
        planetDrag.current = { x: event.clientX, angle: planetRotation };
        event.currentTarget.setPointerCapture(event.pointerId);
      };

      const movePlanet = (event) => {
        if (!planetDrag.current) return;
        setPlanetRotation(planetDrag.current.angle + (event.clientX - planetDrag.current.x) * 0.12);
      };

      const stopPlanetDrag = () => { planetDrag.current = null; };

      const AccentShape = ({ type, color }) => {
        if (type === 'triangle') {
          return (
            <span
              className="block h-0 w-0 border-x-[8px] border-x-transparent border-b-[15px] transition-transform duration-300 group-hover:rotate-[8deg] group-hover:scale-110"
              style={{ borderBottomColor: color, filter: `drop-shadow(0 3px 3px ${color}35)` }}
            />
          );
        }

        return (
          <span
            className={`block h-4 w-4 transition-transform duration-300 group-hover:rotate-[8deg] group-hover:scale-110 ${type === 'circle' ? 'rounded-full' : type === 'square' ? 'rounded-[4px]' : 'rounded-[3px] rotate-45 group-hover:rotate-[53deg]'}`}
            style={{ backgroundColor: color, boxShadow: `0 4px 8px ${color}32` }}
          />
        );
      };

      return (
        <section className="max-w-7xl mx-auto px-6 lg:px-8">
          <style>{`
            @keyframes educationPlanetFloat {
              0%, 100% { transform: translateY(0px); }
              50% { transform: translateY(-7px); }
            }
          `}</style>

          <div className="space-y-1 mb-6 lg:mb-3">
            <div className="text-xs font-mono font-bold text-teal-600 tracking-wider">02 / EDUCATION</div>
            <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900">GLOBAL ACADEMIC JOURNEY</h2>
            <p className="text-xs sm:text-sm text-slate-500">在不同的地方学习，也在不同的视角中理解世界。</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-[55%_45%] gap-8 lg:gap-10 items-start">
            {/* 左侧：纯圆形 Tiny Planet + 本人全身原图抠图 */}
            <figure
              className="group relative aspect-square w-[90%] lg:w-full max-w-[700px] mx-auto overflow-visible cursor-grab active:cursor-grabbing touch-none select-none"
              onPointerDown={startPlanetDrag}
              onPointerMove={movePlanet}
              onPointerUp={stopPlanetDrag}
              onPointerCancel={stopPlanetDrag}
              aria-label="可左右拖动旋转的 Tiny Planet"
            >
              <div className="absolute inset-0 pointer-events-none" style={{ animation: 'educationPlanetFloat 32s ease-in-out infinite' }}>
                <div className="absolute inset-0 transition-transform duration-500 ease-out group-hover:scale-[1.015]">
                  <img
                    src="assets/education-tiny-planet-circular.png"
                    alt="融合武汉、都灵、圣塔芭芭拉与上海地标的圆形 Tiny Planet"
                    draggable="false"
                    className="absolute inset-0 h-full w-full object-contain will-change-transform drop-shadow-[0_22px_35px_rgba(15,23,42,.10)]"
                    style={{ transform: `rotate(${planetRotation}deg)`, transition: planetDrag.current ? 'none' : 'transform 80ms linear' }}
                  />
                </div>

                <div className="absolute left-1/2 top-[69.5%] z-[9] h-[3.8%] w-[15%] -translate-x-1/2 rounded-full bg-slate-950/28 blur-[8px]" />
                <img
                  src="assets/cecilia-education-cutout-v4-natural.png"
                  alt="Cecilia Hu wearing a white NY cap, black top and white trousers"
                  draggable="false"
                  className="absolute left-1/2 top-[28%] z-10 h-[44%] w-auto max-w-none -translate-x-1/2 object-contain drop-shadow-[0_14px_12px_rgba(15,23,42,.24)]"
                />
              </div>
            </figure>

            {/* 右侧：编辑式信息列表，编号与小图形是一个 inline group */}
            <div className="self-start lg:pl-1">
              <div>
                {educationData.map((edu) => (
                  <article key={edu.id} className="group grid grid-cols-[78px_minmax(0,1fr)] sm:grid-cols-[92px_minmax(0,1fr)] gap-3 border-b border-slate-200/90 py-5 sm:py-6 transition-transform duration-300 hover:translate-x-1">
                    <div className="flex items-center gap-2.5 self-start pt-1.5">
                      <span className="font-mono text-xl sm:text-2xl leading-none" style={{ color: edu.accent }}>{edu.num}</span>
                      <AccentShape type={edu.shape} color={edu.accent} />
                    </div>
                    <div className="min-w-0">
                      <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-1 sm:gap-5">
                        <div className="min-w-0">
                          <h3 className="text-lg sm:text-xl font-bold tracking-tight text-slate-900 transition-colors group-hover:text-slate-950">{edu.schoolZh}</h3>
                          <p className="mt-1 text-[11px] sm:text-xs leading-relaxed tracking-wide text-slate-400">{edu.schoolEn}</p>
                        </div>
                        <time className="whitespace-nowrap pt-1 text-[11px] font-mono text-slate-500">{edu.period}</time>
                      </div>
                      <p className="mt-3 text-xs sm:text-sm leading-6 text-slate-600">
                        {[edu.degree, ...edu.highlights].join(' · ')}
                      </p>
                    </div>
                  </article>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* =========================================================================
       03. EXPERIENCE SECTION (collectible experience cards)
       ========================================================================= */

              <div className="absolute inset-0 bg-[radial-gradient(circle_at_25%_5%,rgba(216,180,254,.45),transparent_42%)]" />
              <img src="assets/calio-30-day-challenge.png" alt="Calio 30天健康挑战产品视觉" className="absolute left-1/2 top-0 h-[113%] w-auto -translate-x-1/2 object-contain drop-shadow-[0_14px_20px_rgba(91,54,160,.18)]" />
            </div>
          </div>
        );
      }

      if (type === 'xiaohongshu') {
        return (
          <div className="relative h-full overflow-visible">
            <div className="absolute inset-x-1 inset-y-3 rounded-[28px] bg-orange-400/75 rotate-[6deg]" />
            <div className="absolute inset-0 rounded-[26px] bg-[#FFF9F3] border border-orange-100 shadow-[0_16px_32px_rgba(234,88,12,.13)] overflow-hidden p-4">
            <div className="relative z-10 flex items-end justify-between">
