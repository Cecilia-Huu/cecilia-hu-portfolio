name: Update project demo links

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Vercel demo links with GitHub Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://campus-food-adviser.vercel.app/': 'https://cecilia-huu.github.io/chisha/',
              'campus-food-adviser.vercel.app': 'cecilia-huu.github.io/chisha',
              'https://saidao-cece.vercel.app/': 'https://cecilia-huu.github.io/saidao-cece/',
              'saidao-cece.vercel.app': 'cecilia-huu.github.io/saidao-cece',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated links
        run: |
          if git diff --quiet -- index.html; then
            echo "Demo links already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use GitHub Pages for project demos"
          git push
