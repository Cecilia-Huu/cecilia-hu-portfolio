      0%, 100% { transform: translateY(0px) rotate(0deg); }

    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-5deg); }
    }
    .animate-float-1 { animation: floatSlow 6s ease-in-out infinite; }
    .animate-float-2 { animation: floatReverse 7s ease-in-out infinite 1s; }
    .animate-float-3 { animation: floatSlow 5.5s ease-in-out infinite 0.5s; }

    /* Home: tactile 3D objects + personal-fact interaction */
    .home-object-button {
      position: relative;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .home-object-motion {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 260ms cubic-bezier(.2,.75,.25,1), filter 260ms ease;
      filter: saturate(.98);
      will-change: transform;
    }
    .home-object-button:hover .home-object-motion,
    .home-object-button:focus-visible .home-object-motion,
    .home-object-button[data-active="true"] .home-object-motion {
      transform: translateY(-6px) scale(1.05) rotate(var(--fact-hover-rotate, 1deg));
      filter: saturate(1.06) brightness(1.015);
    }
    .home-object-button:focus-visible {
      outline: 3px solid rgba(255, 85, 0, .25);
      outline-offset: 8px;
      border-radius: 28px;
    }
    .home-object-floor-shadow {
      position: absolute;
      left: 14%;
      right: 14%;
      bottom: -8%;
      height: 18%;
      border-radius: 999px;
      background: rgba(15, 23, 42, .19);
      filter: blur(10px);
      transform: scaleX(.88);
      transition: opacity 260ms ease, transform 260ms ease, filter 260ms ease;
      opacity: .52;
    }
    .home-object-button:hover .home-object-floor-shadow,
    .home-object-button:focus-visible .home-object-floor-shadow,
    .home-object-button[data-active="true"] .home-object-floor-shadow {
      opacity: .7;
      transform: scaleX(1.03) translateY(5px);
      filter: blur(12px);
    }
    .home-sphere-3d {
      border-radius: 50%;
      background:
        radial-gradient(circle at 27% 20%, rgba(255,255,255,.96) 0 5%, rgba(255,255,255,.46) 9%, transparent 24%),
        radial-gradient(circle at 34% 30%, #d8c8ff 0%, #a67cf0 31%, #7953df 58%, #5130b9 78%, #2f267f 100%);
      box-shadow:
        inset 13px 12px 23px rgba(255,255,255,.38),
        inset -18px -22px 30px rgba(40,22,110,.30),
        0 22px 34px rgba(91,55,190,.24);
    }
    .home-cylinder-3d {
      position: relative;
      width: 74%;
      height: 92%;
      margin: 4% auto 0;
      border-radius: 30px 30px 34px 34px;
      transform: rotate(-12deg);
      background:
        linear-gradient(90deg, #1f67bd 0%, #3e91e7 24%, #70b6f3 48%, #2f84db 72%, #15549d 100%);

        inset 12px 0 18px rgba(255,255,255,.25),

      content: '';

      left: 0;
      right: 0;
      top: -7%;
      height: 23%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 38% 28%, #b9e3ff 0%, #73b9ef 38%, #348ad1 72%, #175693 100%);
      box-shadow: inset 0 -6px 10px rgba(15,68,128,.25), inset 6px 5px 8px rgba(255,255,255,.34);
    }
    .home-cylinder-3d::after {
      content: '';
      position: absolute;
      left: 8%;
      right: 8%;
      top: 8%;
      height: 55%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,.24), transparent);
      filter: blur(3px);
    }
    .home-cube-3d {
      position: relative;
      width: 82%;
      height: 82%;
      margin: 9%;
      border-radius: 27%;
      transform: rotate(var(--cube-rotate, 12deg)) skewY(-2deg);
      background: var(--cube-background);
      box-shadow:

        inset -17px -18px 25px rgba(15,23,42,.16),
        0 22px 28px var(--cube-shadow);
      overflow: hidden;
    }
    .home-cube-3d::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, rgba(255,255,255,.44) 0%, transparent 36%, rgba(15,23,42,.13) 100%);
      clip-path: polygon(0 0, 100% 0, 82% 27%, 18% 30%);
    }
    .home-cube-3d::after {
      content: '';
      position: absolute;
      width: 34%;
      height: 70%;
      right: -4%;
      top: 19%;
      border-radius: 50%;
      background: rgba(15,23,42,.11);
      filter: blur(10px);
      transform: rotate(12deg);
    }

    }
    @keyframes matcherResultReveal {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .matcher-dimension-card {

      });
      const [activeTab, setActiveTab] = useState('HOME');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const headerRef = useRef(null);
      const navRef = useRef(null);
      const navButtonRefs = useRef({});
      const sectionVisibilityRef = useRef({});
      const [activePill, setActivePill] = useState({ left: 0, width: 0, opacity: 0 });
      const copy = translations[language];

      const navItems = [
        { id: 'HOME', label: 'Home', sectionId: 'home' },
        { id: 'EDUCATION', label: 'Education', sectionId: 'education' },
        { id: 'EXPERIENCE', label: 'Experience', sectionId: 'experience' },
        { id: 'PROJECTS', label: 'Projects', sectionId: 'projects' },
        { id: 'SKILLS', label: 'Skills', sectionId: 'skills' },
      ];

      useEffect(() => {
        try {
          localStorage.setItem('portfolioLanguage', language);
        } catch (error) {
          // The language still works for this session if storage is unavailable.
        }
        document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
        document.title = copy.global.metaTitle;
      }, [language, copy.global.metaTitle]);

      const updateActivePill = () => {
        const nav = navRef.current;
        const button = navButtonRefs.current[activeTab];
        if (!nav || !button) return;
        setActivePill({
          left: button.offsetLeft,
          width: button.offsetWidth,
          opacity: 1,
        });
      };

      const scrollToSection = (sectionId, behavior = 'smooth') => {
        const target = document.getElementById(sectionId);
        if (!target) return;

        if (sectionId === 'home') {
          window.scrollTo({ top: 0, behavior });
          return;
        }

        const headerBottom = headerRef.current?.getBoundingClientRect().bottom || 72;
        const topGap = 16;
        const targetTop = window.scrollY + target.getBoundingClientRect().top;
        window.scrollTo({
          top: Math.max(0, targetTop - headerBottom - topGap),
          behavior,
        });
      };

      useEffect(() => {
        updateActivePill();
        const observer = typeof ResizeObserver !== 'undefined'
          ? new ResizeObserver(updateActivePill)
          : null;
        if (observer && navRef.current) observer.observe(navRef.current);
        window.addEventListener('resize', updateActivePill);
        return () => {
          if (observer) observer.disconnect();
          window.removeEventListener('resize', updateActivePill);
        };
      }, [activeTab]);

      useEffect(() => {
        const sections = navItems
          .map((item) => document.getElementById(item.sectionId))
          .filter(Boolean);

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            sectionVisibilityRef.current[entry.target.id] = entry.isIntersecting
              ? entry.intersectionRatio
              : 0;
          });

          const visibleItem = navItems.reduce((best, item) => {
            const ratio = sectionVisibilityRef.current[item.sectionId] || 0;
            return ratio > best.ratio ? { id: item.id, ratio } : best;
          }, { id: activeTab, ratio: 0 });

          if (visibleItem.ratio > 0) {
            setActiveTab((current) => current === visibleItem.id ? current : visibleItem.id);
            const visibleSection = navItems.find((item) => item.id === visibleItem.id);
            const nextHash = visibleSection ? '#' + visibleSection.sectionId : '';
            if (nextHash && window.location.hash !== nextHash) {
              window.history.replaceState(null, '', nextHash);
            }
          }
        }, {
          rootMargin: '-18% 0px -52% 0px',
          threshold: [0, 0.1, 0.25, 0.5, 0.75],
        });

        sections.forEach((section) => observer.observe(section));

        const initialHash = window.location.hash.replace('#', '').toLowerCase();
        if (navItems.some((item) => item.sectionId === initialHash)) {
          window.requestAnimationFrame(() => {
            scrollToSection(initialHash, 'auto');
          });
        }

        return () => observer.disconnect();
      }, []);

      const handleNavigate = (item) => {
        const target = document.getElementById(item.sectionId);
        if (!target) return;
        setActiveTab(item.id);
        window.history.replaceState(null, '', '#' + item.sectionId);
        scrollToSection(item.sectionId);
      };

      return (
        <LanguageContext.Provider value={{ language, copy }}>
        <div className="min-h-screen flex flex-col justify-between relative">
          
          {/* 1. 顶部悬浮胶囊导航 */}

              <div 
                className="font-bold text-xs tracking-wider uppercase text-slate-900 cursor-pointer flex items-center space-x-2"
                onClick={() => handleNavigate(navItems[0])}
              >
                <div className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold text-[10px]">胡</div>

              </div>

              <nav ref={navRef} aria-label="Portfolio sections" className="relative flex min-w-0 flex-1 items-center space-x-1 overflow-x-auto text-xs font-medium text-slate-600 [scrollbar-width:none] sm:space-x-2">
                <span
                  aria-hidden="true"
                  className="pointer-events-none absolute bottom-0 top-0 rounded-full bg-[#FF5500] shadow-md transition-all duration-[260ms] ease-out"
                  style={{ left: activePill.left, width: activePill.width, opacity: activePill.opacity }}
                />
                {navItems.map((item) => (
                  <button
                    key={item.id}
                    ref={(node) => { navButtonRefs.current[item.id] = node; }}
                    onClick={() => handleNavigate(item)}
                    aria-current={activeTab === item.id ? 'page' : undefined}
                    className={`relative z-10 whitespace-nowrap px-2 py-1.5 rounded-full transition-colors duration-200 sm:px-3.5 ${
                      activeTab === item.id
                        ? 'text-white font-bold'
                        : 'hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
              </nav>

              <div className="flex shrink-0 items-center rounded-full border border-slate-200 bg-slate-50/80 p-0.5 text-[10px] font-bold text-slate-400" role="group">
                <button type="button" aria-pressed={language === 'zh'} onClick={() => setLanguage('zh')} className={`rounded-full px-2 py-1 transition-colors ${language === 'zh' ? 'bg-white text-[#FF5500] shadow-sm' : 'hover:text-slate-700'}`}>中</button>
                <span aria-hidden="true" className="text-slate-300">/</span>
                <button type="button" aria-pressed={language === 'en'} onClick={() => setLanguage('en')} className={`rounded-full px-2 py-1 transition-colors ${language === 'en' ? 'bg-white text-[#FF5500] shadow-sm' : 'hover:text-slate-700'}`}>EN</button>
              </div>

              <ContactMenu />
            </div>
          </header>

          {/* 2. 单页连续浏览：Navbar 快捷跳转 + 自然纵向滚动 */}
          <main>
            <section id="home" data-section="HOME" className="portfolio-section min-h-screen pt-28 pb-16 flex items-center">
              <div className="w-full">
              <HomeLarryStyle 
                onOpenMatcher={() => setIsModalOpen(true)}

            </section>

            <section id="education" data-section="EDUCATION" className="portfolio-section content-section">
              <EducationSection />
            </section>

            <section id="experience" data-section="EXPERIENCE" className="portfolio-section content-section">
              <ExperienceSection />
            </section>

            <section id="projects" data-section="PROJECTS" className="portfolio-section content-section">
              <ProjectsSection />
            </section>

            <section id="skills" data-section="SKILLS" className="portfolio-section content-section">
              <SkillsSection />
            </section>
          </main>

          {/* 3. 页脚 */}
          <footer className="py-6 border-t border-slate-100 text-center text-xs text-slate-400 font-mono">
            {copy.global.footer}
          </footer>

          {/* 4. AI 岗位匹配器 Modal 弹窗 */}
          {isModalOpen && <AIMatcherModal onClose={() => setIsModalOpen(false)} />}

        </div>
        </LanguageContext.Provider>
      );
    }

        { id: 'ucsb', num: '03', accent: '#2563EB', shape: 'square', period: '2021–2022', ...copy.education.items.ucsb },
        { id: 'hbu', num: '04', accent: '#0FAF8F', shape: 'diamond', period: '2019–2023', ...copy.education.items.hbu },
      ];

      const [planetRotation, setPlanetRotation] = useState(0);
      const planetDrag = useRef(null);

      useEffect(() => {
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let animationFrame;
        let lastTime = performance.now();

        const rotatePlanet = (time) => {
          const elapsed = Math.min(time - lastTime, 50);
          lastTime = time;

          if (!planetDrag.current && !reduceMotion.matches) {
            // One calm revolution every two minutes.
            setPlanetRotation((angle) => (angle + elapsed * 0.003) % 360);
          }

          animationFrame = requestAnimationFrame(rotatePlanet);
        };

        animationFrame = requestAnimationFrame(rotatePlanet);
        return () => cancelAnimationFrame(animationFrame);
      }, []);

      const startPlanetDrag = (event) => {
        planetDrag.current = { x: event.clientX, angle: planetRotation };
        event.currentTarget.setPointerCapture(event.pointerId);
      };

      const movePlanet = (event) => {
        if (!planetDrag.current) return;
        setPlanetRotation(planetDrag.current.angle + (event.clientX - planetDrag.current.x) * 0.12);
      };

      const stopPlanetDrag = () => { planetDrag.current = null; };

      const AccentShape = ({ type, color }) => {
        if (type === 'triangle') {
          return (

            />
          );
        }

        return (
          <span
            className={`block h-4 w-4 transition-transform duration-300 group-hover:rotate-[8deg] group-hover:scale-110 ${type === 'circle' ? 'rounded-full' : type === 'square' ? 'rounded-[4px]' : 'rounded-[3px] rotate-45 group-hover:rotate-[53deg]'}`}

            >
              <div className="absolute inset-0 pointer-events-none" style={{ animation: 'educationPlanetFloat 32s ease-in-out infinite' }}>

    // AI 岗位匹配器 Modal 弹窗
    function AIMatcherModal({ onClose }) {
      const { copy } = useLanguage();
      const [jdText, setJdText] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [hasAnalyzed, setHasAnalyzed] = useState(false);
      const [selectedRole, setSelectedRole] = useState('');
      const [loadingStep, setLoadingStep] = useState(0);
      const [activeDimension, setActiveDimension] = useState(null);
      const [matchResult, setMatchResult] = useState(null);
      const analysisTimerRef = useRef(null);

      const presetRoles = [
        { id: 'consumer', query: 'C端产品经理', label: copy.matcher.presets[0], icon: '♙', color: '#8b5cf6' },
        { id: 'ai', query: 'AI 产品经理', label: copy.matcher.presets[1], icon: '✦', color: '#16a871' },
        { id: 'global', query: '国际化 / 出海 PM', label: copy.matcher.presets[2], icon: '◎', color: '#3478f6' },
        { id: 'data', query: '数据 / 策略 PM', label: copy.matcher.presets[3], icon: '▥', color: '#ff6b1a' },
      ];
      const dimensions = [
        { id: 'product', accent: '#8b5cf6', icon: '◇', ...copy.matcher.dimensions.product },
        { id: 'data', accent: '#16a871', icon: '◫', ...copy.matcher.dimensions.data },
        { id: 'ai', accent: '#a43dff', icon: '✦', ...copy.matcher.dimensions.ai },
        { id: 'collaboration', accent: '#3478f6', icon: '♙', ...copy.matcher.dimensions.collaboration },
        { id: 'execution', accent: '#ff6b1a', icon: '◎', ...copy.matcher.dimensions.execution },
      ];
      const candidateProfile = {
        product: ['AI 健康产品经理实习', '独立输出 PRD', '需求分析与业务流程设计', '研发评审', 'Vibe Coding 独立产品'],
        data: ['SQL Mapping 与数据口径', '埋点与数据分析体系', 'RedBI', 'KNIME / Tableau', 'SPSS / Stata'],
        ai: ['Cursor', 'Vibe Coding', 'Dify', 'n8n', 'AI 数据运营与产品实践'],
        collaboration: ['TikTok 跨国项目', '30+ 人项目协作', '10+ 轮英文校准会议', '跨团队沟通与研发评审'],
        execution: ['独立 Own PRD', '0→1 数据分析体系', '推动需求评审', '独立产品上线', 'SOP 搭建'],
        missingEngineering: ['Java', 'C++', 'Go', '后端开发', '服务端技术栈', '分布式系统', '微服务', '系统架构', 'DevOps', '云原生工程'],
      };

      const classifyRole = (query) => {
        const contains = (words) => words.some((word) => query.includes(word));
        const engineeringCore = ['后端', '服务端', 'java', 'c++', 'golang', 'spring', 'redis', 'kafka', '微服务', '分布式', '高并发', '系统设计', 'database architecture', 'microservices', 'backend', 'server', 'devops', '云原生', '前端工程', '算法工程', '模型训练'];
        if (contains(engineeringCore)) return { id: 'engineering', label: '研发 / Engineering' };
        if (contains(['ai 产品', 'ai产品', '人工智能产品', '大模型产品'])) return { id: 'aiProduct', label: 'AI 产品' };
        if (contains(['国际化 / 出海 pm', '国际化 pm', '出海 pm'])) return { id: 'product', label: '国际化产品' };
        if (contains(['产品经理', '产品运营', 'product manager', 'product owner', 'c端产品', 'b端产品'])) return { id: 'product', label: '产品' };
        if (contains(['数据分析师', '数据科学', '商业分析', 'data analyst', 'analytics'])) return { id: 'data', label: '数据' };
        if (contains(['策略', '战略', 'strategy'])) return { id: 'strategy', label: '策略' };
        if (contains(['运营', 'operations', 'operation'])) return { id: 'operations', label: '运营' };
        if (contains(['市场', '营销', '品牌', 'marketing', 'growth'])) return { id: 'marketing', label: '市场' };
        if (contains(['项目经理', '项目管理', 'project manager', 'pmo'])) return { id: 'project', label: '项目管理' };
        return { id: 'other', label: '其他' };
      };

      const buildMatchResult = (sourceText) => {
        const query = sourceText.toLowerCase().replace(/\s+/g, ' ').trim();
        const contains = (words) => words.some((word) => query.includes(word));
        const countHits = (words) => words.filter((word) => query.includes(word)).length;
        const role = classifyRole(query);
        const international = contains(['国际化', '出海', '海外', '全球', '跨文化', '英文', 'global', 'international', 'overseas', 'cross-cultural', 'english']);
        const senior = contains(['8年以上', '八年以上', '10年以上', '十年以上', '总监', '负责人', '8+ years', '10+ years', 'director', 'head of']);
        const commercial = contains(['多年商业化', '广告平台', '增长变现', '商业化负责人', 'monetization', 'advertising platform', 'commercial lead']);
        const engineeringSkills = ['java', 'c++', 'go', 'golang', 'spring', 'redis', 'kafka', '微服务', '分布式', '高并发', '系统架构', '后端开发', '服务端开发', 'devops', '云原生'];
        const missingCoreCount = countHits(engineeringSkills);

        const roleModels = {
          product: { score: 88, demand: [94, 76, 48, 82, 92], ability: [92, 84, 60, 88, 93] },
          aiProduct: { score: 84, demand: [90, 76, 92, 78, 88], ability: [90, 83, 82, 86, 91] },
          data: { score: 72, demand: [54, 96, 54, 66, 78], ability: [62, 88, 50, 76, 78] },
          strategy: { score: 74, demand: [72, 88, 42, 82, 76], ability: [76, 87, 48, 86, 80] },
          operations: { score: 69, demand: [66, 72, 38, 88, 92], ability: [68, 78, 42, 86, 88] },
          marketing: { score: 56, demand: [48, 70, 28, 82, 84], ability: [52, 72, 34, 82, 76] },
          project: { score: 78, demand: [62, 58, 34, 94, 94], ability: [72, 70, 42, 92, 91] },
          engineering: { score: 34, demand: [22, 56, 28, 62, 86], ability: [18, 34, 22, 66, 48] },
          other: { score: 52, demand: [50, 50, 40, 60, 65], ability: [48, 54, 42, 68, 66] },
        };
        const model = roleModels[role.id];
        const demand = [...model.demand];
        const ability = [...model.ability];
        let internalScore = model.score;

        if (international && ['product', 'aiProduct', 'project'].includes(role.id)) {
          demand[3] = 95; ability[3] = 94; internalScore += role.id === 'product' ? 5 : 3;
        }
        if (contains(['sql', 'tableau', 'knime', '数据分析', '数据驱动', '指标'])) {
          demand[1] = Math.max(demand[1], 88);
          ability[1] = Math.max(ability[1], role.id === 'engineering' ? 42 : 90);
          if (role.id !== 'engineering') internalScore += 2;
        }
        if (contains(['cursor', 'dify', 'n8n', 'vibe coding', 'ai 工具'])) {
          demand[2] = Math.max(demand[2], 86);
          ability[2] = Math.max(ability[2], 86);
          if (['product', 'aiProduct', 'operations'].includes(role.id)) internalScore += 3;
        }
        if (senior) internalScore -= 14;
        if (commercial) internalScore -= 7;
        if (role.id === 'engineering') internalScore = Math.min(internalScore - Math.min(missingCoreCount * 2, 10), 39);

        const grade = { letter: internalScore >= 82 ? 'A' : internalScore >= 60 ? 'B' : 'C' };

        const evidence = {
          product: { id: 'product', copyKey: 'product' }, data: { id: 'data', copyKey: 'data' }, ai: { id: 'ai', copyKey: 'ai' },
          collaboration: { id: 'collaboration', copyKey: international ? 'collaborationInternational' : 'collaborationDefault' },
          execution: { id: 'execution', copyKey: 'execution' }, transferableData: { id: 'data', copyKey: 'transferableData' },
          transferableCollab: { id: 'collaboration', copyKey: 'transferableCollaboration' },
        };

        let highlights;
        let summaryKey;
        let gapKey;
        if (role.id === 'engineering') {
          highlights = [evidence.transferableData, evidence.transferableCollab];
          summaryKey = 'engineering.summary'; gapKey = 'engineering.gap';
        } else if (role.id === 'product') {
          highlights = international ? [evidence.collaboration, evidence.product, evidence.data] : [evidence.product, evidence.execution, evidence.data];
          summaryKey = international ? 'productInternational.summary' : 'productDefault.summary';
          gapKey = senior ? 'productSenior.gap' : commercial ? 'productCommercial.gap' : 'productDefault.gap';
        } else if (role.id === 'aiProduct') {
          highlights = [evidence.ai, evidence.product, evidence.execution];
          summaryKey = 'aiProduct.summary'; gapKey = 'aiProduct.gap';
        } else if (role.id === 'data' || role.id === 'strategy') {
          highlights = [evidence.data, evidence.product, evidence.collaboration];
          summaryKey = 'dataStrategy.summary'; gapKey = role.id === 'data' ? 'data.gap' : 'strategy.gap';
        } else if (role.id === 'project' || role.id === 'operations') {
          highlights = [evidence.collaboration, evidence.execution, evidence.data];
          summaryKey = 'projectOperations.summary'; gapKey = 'projectOperations.gap';
        } else {
          highlights = [evidence.collaboration, evidence.data];
          summaryKey = 'other.summary'; gapKey = 'other.gap';
        }

        const coreCoverage = role.id === 'engineering'
          ? { matched: ['跨团队协作'], partial: ['SQL / 数据理解'], missing: engineeringSkills.filter((skill) => query.includes(skill)) }
          : { matched: candidateProfile[role.id === 'aiProduct' ? 'ai' : role.id] || candidateProfile.collaboration, partial: [], missing: [] };

        return { roleId: role.id, grade, ability, demand, summaryKey, gapKey, highlights, coreCoverage };
      };

      useEffect(() => {
        if (!isAnalyzing) return undefined;
        const stepTimer = window.setInterval(() => setLoadingStep((current) => (current + 1) % 4), 190);
        return () => window.clearInterval(stepTimer);
      }, [isAnalyzing]);
      useEffect(() => () => {
        if (analysisTimerRef.current) window.clearTimeout(analysisTimerRef.current);
      }, []);

      const handleStartMatch = (presetRole) => {
        const isPreset = presetRole && typeof presetRole === 'object';
        const selectedPreset = presetRoles.find((preset) => preset.id === selectedRole);
        const nextRole = isPreset ? presetRole.query : selectedPreset?.query || '';
        if (isPreset) setSelectedRole(presetRole.id);
        setHasAnalyzed(false);
        setActiveDimension(null);
        setLoadingStep(0);
        setIsAnalyzing(true);
        if (analysisTimerRef.current) window.clearTimeout(analysisTimerRef.current);
        analysisTimerRef.current = window.setTimeout(() => {
          setMatchResult(buildMatchResult((nextRole + ' ' + jdText).trim()));
          setIsAnalyzing(false);
          setHasAnalyzed(true);
        }, 760);
      };

      const center = { x: 220, y: 166 };
      const radius = 108;
      const angles = [-90, -18, 54, 126, 198];
      const pointAt = (length, angle) => {
        const radians = angle * Math.PI / 180;
        return { x: center.x + Math.cos(radians) * length, y: center.y + Math.sin(radians) * length };
      };
      const polygonPoints = (values, maxRadius = radius) => values.map((value, index) => {
        const point = pointAt(maxRadius * value / 100, angles[index]);
        return point.x.toFixed(1) + ',' + point.y.toFixed(1);
      }).join(' ');
      const activeDimensionData = dimensions.find((item) => item.id === activeDimension);
      const loadingMessages = copy.matcher.loading;
      const branchCopy = (path) => path.split('.').reduce((value, key) => value[key], copy.matcher.branches);
      const gradeCopy = matchResult ? copy.matcher.grades[matchResult.grade.letter] : null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-slate-900/55 backdrop-blur-md animate-fade-in">
          <div role="dialog" aria-modal="true" aria-labelledby="matcher-title" onClick={(event) => { if (!event.target.closest('[data-radar-dimension]')) setActiveDimension(null); }} className="matcher-modal bg-white w-full max-w-[1160px] rounded-[26px] shadow-[0_28px_90px_rgba(15,23,42,.24)] border border-white/80 overflow-hidden max-h-[90vh] flex flex-col">
            <div className="matcher-modal-header px-5 pt-4 pb-3 sm:px-7 sm:pt-5 flex items-start justify-between">
              <div>
                <div className="flex items-center gap-2.5">
                  <h2 id="matcher-title" className="text-xl sm:text-2xl font-extrabold tracking-tight text-[#0c1836]">{copy.matcher.title}</h2>
                  <span className="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full">Beta</span>
                </div>
                <p className="mt-1 text-xs text-slate-400">{copy.matcher.subtitle}</p>
              </div>
              <button onClick={onClose} aria-label={copy.matcher.closeAria} className="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-sm transition-colors">✕</button>
            </div>

            <div className="matcher-scroll-area px-4 pb-3 sm:px-7 sm:pb-4 overflow-y-auto">
              <div className="matcher-input-panel bg-slate-50/70 p-3 rounded-[18px] border border-slate-200/80 space-y-2">
                <div className="text-xs font-bold text-[#0c1836]">{copy.matcher.presetsLabel}</div>
                <div className="flex flex-wrap gap-2">
                  {presetRoles.map((preset) => (
                    <button key={preset.id} onClick={() => handleStartMatch(preset)} aria-pressed={selectedRole === preset.id} className={'flex items-center gap-1.5 text-[11px] sm:text-xs bg-white border px-3 py-1.5 rounded-full text-slate-700 hover:-translate-y-0.5 hover:shadow-md font-semibold transition-all ' + (selectedRole === preset.id ? 'border-slate-400 shadow-sm' : 'border-slate-200')}>
                      <span style={{ color: preset.color }} className="text-base leading-none">{preset.icon}</span>{preset.label}
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-2 bg-white rounded-2xl p-1.5 border border-slate-200 focus-within:border-slate-400 focus-within:shadow-sm transition-all">
                  <input
                    type="text"
                    value={jdText}
                    onChange={(e) => setJdText(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter' && !isAnalyzing) handleStartMatch(); }}
                    placeholder={copy.matcher.placeholder}
                    className="min-w-0 flex-1 text-xs sm:text-sm px-2 sm:px-3 outline-none text-slate-800 placeholder:text-slate-400"
                  />
                  <button disabled={isAnalyzing} onClick={() => handleStartMatch()} className="shrink-0 bg-[#0c1836] hover:bg-slate-800 disabled:opacity-70 text-white text-xs sm:text-sm font-bold px-4 sm:px-6 py-2 sm:py-2.5 rounded-xl transition-colors">
                    {isAnalyzing ? copy.matcher.analyzing : copy.matcher.analyze}
                  </button>
                </div>
              </div>

              {isAnalyzing && (
                <div className="mt-4 min-h-[260px] flex flex-col items-center justify-center rounded-[22px] border border-slate-100 bg-white text-center">
                  <div className="flex gap-1.5 mb-4" aria-hidden="true">
                    <span className="matcher-loading-dot w-2.5 h-2.5 rounded-full bg-orange-500" /><span className="matcher-loading-dot w-2.5 h-2.5 rounded-full bg-violet-400" /><span className="matcher-loading-dot w-2.5 h-2.5 rounded-full bg-emerald-400" />
                  </div>
                  <p className="text-base font-bold text-[#0c1836]">{copy.matcher.analyzingTitle}</p>
                  <p className="mt-2 text-xs text-slate-400" aria-live="polite">{loadingMessages[loadingStep]}</p>
                </div>
              )}

              {hasAnalyzed && matchResult && (
                <div className="matcher-result-reveal mt-3 grid grid-cols-1 lg:grid-cols-12 gap-3">
                  <section className="matcher-main-card lg:col-span-4 min-h-[280px] relative overflow-hidden flex flex-col items-center justify-center p-4 rounded-[20px] bg-[#fff8f3] border border-orange-100 text-center">
                    <div className="absolute -left-12 -top-12 w-40 h-40 rounded-full bg-orange-100/45 blur-2xl" />
                    <div className="relative text-[11px] font-extrabold tracking-[.16em] text-orange-600">AI MATCH RESULT</div>
                    <div className="matcher-grade-letter relative text-[92px] sm:text-[100px] leading-[.88] font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-orange-400 to-orange-600 drop-shadow-[0_10px_13px_rgba(249,115,22,.18)]">{matchResult.grade.letter}</div>
                    <div className="relative text-xl sm:text-2xl font-black tracking-tight text-[#0c1836]">{gradeCopy.title}</div>
                    {gradeCopy.english && <div className="relative mt-0.5 text-[11px] font-bold text-orange-600">{gradeCopy.english}</div>}
                    <div className="matcher-grade-note relative mt-3 w-full rounded-xl border border-orange-200/80 bg-white/75 px-3 py-2 text-left text-[11px] leading-relaxed text-slate-600"><span className="mr-1.5">⭐</span>{gradeCopy.note}</div>
                  </section>

                  <section className="matcher-main-card lg:col-span-8 relative min-h-[280px] rounded-[20px] bg-white border border-slate-200/90 overflow-hidden">
                    <div className="absolute right-4 top-4 z-10 flex items-center gap-1 text-[10px] text-slate-400"><span className="hidden sm:inline">{copy.matcher.hoverHint}</span><span className="w-4 h-4 rounded-full border border-slate-300 flex items-center justify-center font-serif">i</span></div>
                    <svg viewBox="0 0 600 330" className="matcher-radar block w-full h-[280px]" aria-label={copy.matcher.radarAria}>
                      {[1, .75, .5, .25].map((level) => <polygon key={level} points={polygonPoints([100,100,100,100,100], radius * level)} fill="none" stroke="#dbe2eb" strokeWidth="1" />)}
                      {angles.map((angle) => { const end = pointAt(radius, angle); return <line key={angle} x1={center.x} y1={center.y} x2={end.x} y2={end.y} stroke="#e3e8ef" strokeWidth="1" />; })}
                      <polygon points={polygonPoints(matchResult.demand)} fill="rgba(148,163,184,.08)" stroke="#b8c1cf" strokeWidth="1.3" strokeDasharray="4 4" />
                      <polygon points={polygonPoints(matchResult.ability)} fill="rgba(255,126,53,.18)" stroke="#ff6b1a" strokeWidth="2" />
                      {matchResult.ability.map((value, index) => {
                        const point = pointAt(radius * value / 100, angles[index]);
                        const dimension = dimensions[index];
                        return <circle key={dimension.id} data-radar-dimension="true" role="button" tabIndex="0" aria-label={copy.matcher.dimensionAria(dimension.title)} cx={point.x} cy={point.y} r={activeDimension === dimension.id ? 8 : 5.5} fill={activeDimension === dimension.id ? dimension.accent : '#ff6b1a'} stroke="white" strokeWidth="3" className="matcher-radar-label transition-all" onMouseEnter={() => setActiveDimension(dimension.id)} onFocus={() => setActiveDimension(dimension.id)} onClick={(event) => { event.stopPropagation(); setActiveDimension((current) => current === dimension.id ? null : dimension.id); }} onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setActiveDimension(dimension.id); } }} />;
                      })}
                      {[
                        { x: 220, y: 22, anchor: 'middle' }, { x: 370, y: 110, anchor: 'start' }, { x: 333, y: 300, anchor: 'start' }, { x: 108, y: 300, anchor: 'end' }, { x: 64, y: 110, anchor: 'end' },
                      ].map((position, index) => {
                        const dimension = dimensions[index];
                        return (
                          <g key={dimension.id} data-radar-dimension="true" role="button" tabIndex="0" aria-label={copy.matcher.dimensionAria(dimension.title)} className="matcher-radar-label" onMouseEnter={() => setActiveDimension(dimension.id)} onFocus={() => setActiveDimension(dimension.id)} onClick={(event) => { event.stopPropagation(); setActiveDimension((current) => current === dimension.id ? null : dimension.id); }} onKeyDown={(event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); setActiveDimension(dimension.id); } }}>
                            <rect className="matcher-label-pill" x={position.anchor === 'middle' ? position.x - 53 : position.anchor === 'end' ? position.x - 112 : position.x - 7} y={position.y - 17} width="120" height="34" rx="17" fill={activeDimension === dimension.id ? dimension.accent + '12' : 'transparent'} stroke="transparent" />
                            <text x={position.x} y={position.y + 5} textAnchor={position.anchor} fontSize="14" fontWeight="700" fill="#0c1836"><tspan fill={dimension.accent}>{dimension.icon} </tspan>{dimension.title}</text>
                          </g>
                        );
                      })}
                      <g transform="translate(128 318)"><line x1="0" y1="0" x2="20" y2="0" stroke="#ff6b1a" strokeWidth="2" /><circle cx="10" cy="0" r="3" fill="#ff6b1a" /><text x="28" y="4" fontSize="10" fill="#8290a6">{copy.matcher.radarLegend.candidate}</text><line x1="150" y1="0" x2="170" y2="0" stroke="#b8c1cf" strokeWidth="1.3" strokeDasharray="4 3" /><text x="178" y="4" fontSize="10" fill="#8290a6">{copy.matcher.radarLegend.requirement}</text></g>
                    </svg>
                    <div data-radar-dimension="true" data-visible={Boolean(activeDimensionData)} className="matcher-dimension-card absolute z-20 right-3 top-12 w-[238px] rounded-[18px] border border-slate-200 bg-white/95 p-4 shadow-[0_16px_40px_rgba(15,23,42,.14)] backdrop-blur-md">
                      {activeDimensionData && <React.Fragment><div className="flex items-center gap-2 font-bold text-sm text-[#0c1836]"><span style={{ color: activeDimensionData.accent }} className="text-lg">{activeDimensionData.icon}</span>{activeDimensionData.title}</div><p className="mt-2.5 text-[11px] font-semibold leading-relaxed text-slate-700">{activeDimensionData.keywords}</p><div className="my-3 h-px bg-slate-100" /><p className="text-[10px] leading-relaxed text-slate-500">{activeDimensionData.description}</p></React.Fragment>}
                    </div>
                  </section>

                  <section className="matcher-bottom-card lg:col-span-4 rounded-[20px] border border-slate-200/90 bg-white p-4">
                    <h3 className="text-sm font-extrabold text-[#0c1836]">🤖 <span className="ml-1">{copy.matcher.assessment}</span></h3>
                    <div className="mt-2 text-[11px] sm:text-xs leading-relaxed text-slate-600 space-y-1.5"><p>{branchCopy(matchResult.summaryKey)}</p><p>{branchCopy(matchResult.gapKey)}</p></div>
                  </section>
                  <section className="matcher-bottom-card lg:col-span-8 rounded-[20px] border border-slate-200/90 bg-white p-4">
                    <h3 className="text-sm font-extrabold text-[#0c1836]">⭐ <span className="ml-1">{copy.matcher.highlights}</span></h3>
                    <div className={'mt-2 grid grid-cols-1 gap-2 ' + (matchResult.highlights.length === 2 ? 'sm:grid-cols-2' : 'sm:grid-cols-3')}>
                      {matchResult.highlights.map((highlight, index) => {
                        const dimension = dimensions.find((item) => item.id === highlight.id);
                        const highlightCopy = copy.matcher.evidence[highlight.copyKey];
                        return <article key={highlight.copyKey} className="rounded-xl border border-slate-100 bg-slate-50/65 p-2.5"><div className="flex items-center gap-2"><span style={{ backgroundColor: dimension.accent }} className="w-5 h-5 shrink-0 rounded-full text-white text-[8px] font-bold flex items-center justify-center">{'0' + (index + 1)}</span><h4 className="text-[11px] font-bold text-[#0c1836]">{highlightCopy.title}</h4></div><p className="matcher-clamp-2 mt-1.5 text-[10px] leading-relaxed text-slate-500">{highlightCopy.text}</p></article>;
                      })}
                    </div>
                  </section>
                </div>
              )}
            </div>

            <div className="px-5 py-2 border-t border-slate-100 flex items-center justify-between gap-3 bg-white sm:px-7 min-h-[44px]">
              <p className="hidden sm:block text-[10px] text-slate-400">{copy.matcher.tip}</p>
              <button onClick={onClose} className="ml-auto bg-[#0c1836] hover:bg-slate-800 text-white text-xs font-bold px-5 py-2 rounded-full transition-colors">
                {copy.matcher.close}
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
